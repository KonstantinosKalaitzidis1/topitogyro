name: Καθημερινή ενημέρωση ΠΙΤΟΓΥΡΟ

on:
  schedule:
    - cron: "15 4 * * *" # 07:15 Europe/Athens during EEST; UTC schedule shifts vs winter time
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "pitogyro/content/verified-queue.json"
      - "pitogyro/content/images.json"
      - "pitogyro/content/arthra.json"
      - "pitogyro/sources.json"
      - "pitogyro/scripts/fetch.mjs"
      - "pitogyro/scripts/rank-discovery.mjs"
      - "pitogyro/scripts/resolve-publisher.mjs"
      - "pitogyro/scripts/verify.mjs"
      - "pitogyro/scripts/verify-search.mjs"
      - "pitogyro/scripts/merge-verified.mjs"
      - "pitogyro/scripts/write.mjs"
      - "pitogyro/scripts/build.mjs"
      - ".github/workflows/daily-pitogyro.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pitogyro
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pitogyro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pitogyro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch discovery radar and approved inputs
        run: npm run fetch

      - name: Hard-filter and rank discovery leads
        run: npm run rank-discovery

      - name: Resolve publisher article URLs without AI
        run: npm run resolve-publisher

      - name: Verify radar candidates against publisher-linked first-party pages
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          VERIFY_LIMIT_TOTAL: ${{ vars.VERIFY_LIMIT_TOTAL }}
          VERIFY_RETRY_DAYS: ${{ vars.VERIFY_RETRY_DAYS }}
        run: npm run verify

      - name: Search for first-party source when publisher link is insufficient
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          VERIFY_SEARCH_LIMIT_TOTAL: ${{ vars.VERIFY_SEARCH_LIMIT_TOTAL }}
        run: npm run verify-search

      - name: Merge first-party verified facts into writer input
        run: npm run merge-verified

      - name: Check whether there is new content
        id: new_content
        shell: bash
        run: |
          COUNT=$(node -e "const x=require('./content/items.json'); console.log((x.ath?.length||0)+(x.thes?.length||0)+(x.global?.length||0))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New verified/inspiration items: $COUNT"

      - name: Generate original articles
        if: steps.new_content.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ORIO_ARTHRON: ${{ vars.ORIO_ARTHRON }}
          ORIO_GLOBAL: ${{ vars.ORIO_GLOBAL }}
        run: npm run write

      - name: Rebuild site
        run: npm run build

      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "pitogyro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html \
            content/items.json \
            content/discovery.json \
            content/auto-verified.json \
            content/verification-history.json \
            content/arthra.json \
            content/history.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: daily automated city update"
          if git push origin main; then
            echo "Generated content pushed successfully."
          else
            echo "Main changed during this run; skipping stale generated output. A newer run will regenerate from the current main."
            exit 0
          fi

  deploy:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload latest site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "pitogyro"

      - name: Deploy latest main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
