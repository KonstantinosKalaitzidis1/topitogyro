name: Καθημερινή ενημέρωση ΠΙΤΟΓΥΡΟ

on:
  schedule:
    - cron: "15 4 * * *" # 07:15 Europe/Athens during EEST; UTC schedule shifts vs winter time
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "pitogyro/content/verified-queue.json"
      - "pitogyro/content/images.json"
      - "pitogyro/sources.json"
      - "pitogyro/scripts/fetch.mjs"
      - "pitogyro/scripts/write.mjs"
      - "pitogyro/scripts/build.mjs"

permissions:
  contents: write

concurrency:
  group: daily-pitogyro
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pitogyro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pitogyro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch approved feeds and verified queue
        run: npm run fetch

      - name: Check whether there is new content
        id: new_content
        shell: bash
        run: |
          COUNT=$(node -e "const x=require('./content/items.json'); console.log((x.ath?.length||0)+(x.thes?.length||0)+(x.global?.length||0))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "New source items: $COUNT"

      - name: Generate original articles
        if: steps.new_content.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ORIO_ARTHRON: ${{ vars.ORIO_ARTHRON }}
          ORIO_GLOBAL: ${{ vars.ORIO_GLOBAL }}
        run: npm run write

      - name: Rebuild site
        run: npm run build

      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "pitogyro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html content/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily automated city update"
          git pull --rebase origin main
          git push
